<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>拖拽功能测试页</title>
    <style>
        .kanban {
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        .kanban-column {
            width: 220px;
            background: #eee;
            padding:10px;
            min-height:300px;
        }
        .task-card {
            background: white;
            padding:8px;
            margin:6px 0;
            border:1px solid #ccc;
            cursor: grab;
        }
    </style>
</head>
<body>
    <div class="kanban">
        <div class="kanban-column" data-status="todo">
            <h3>待办</h3>
            <div class="task-card" draggable="true" data-id="1">测试任务1</div>
            <div class="task-card" draggable="true" data-id="2">测试任务2</div>
        </div>
        <div class="kanban-column" data-status="doing">
            <h3>进行中</h3>
        </div>
        <div class="kanban-column" data-status="done">
            <h3>已完成</h3>
        </div>
    </div>
    <script src="drag.js"></script>
</body>
</html>
